server.port=${PORT:3000}
server.error.include-message=never
server.error.include-stacktrace=never

app.db.path=${APP_DB_PATH:data/smart-content-manager.db}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.benchmark-report-path=${APP_BENCHMARK_REPORT_PATH:out/benchmark-results.csv}
app.access-history-limit=${APP_ACCESS_HISTORY_LIMIT:20}
app.attachment.storage-dir=${APP_ATTACHMENT_STORAGE_DIR:data/attachments}
app.attachment.max-file-size=${APP_ATTACHMENT_MAX_FILE_SIZE:20MB}

spring.servlet.multipart.max-file-size=${APP_ATTACHMENT_MAX_FILE_SIZE:20MB}
spring.servlet.multipart.max-request-size=${APP_ATTACHMENT_MAX_REQUEST_SIZE:21MB}

logging.level.root=INFO
